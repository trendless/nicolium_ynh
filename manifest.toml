#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nicolium"
name = "Nicolium"
description.en = "Mastodon-compatible social media front-end"
description.fr = "Mastodon-social compatible moyen front-end"

version = "2026.03.06~ynh1"

maintainers = ["trendless"]

[upstream]
license = "AGPL-3.0-or-later"
demo = "https://web.nicolium.app/"
code = "https://codeberg.org/mkljczk/nicolium"

# cpe = "???"

fund = "https://www.paypal.me/mkljczk"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "1G"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    	[resources.sources.main]
    	url = "https://codeberg.org/mkljczk/nicolium/archive/a6dff620347e5e49c8bf71ff10d52bed3196b6ee.tar.gz"
    	sha256 = "c1b8e1a48cb1b03b31dfa64eced921207f465713069bfd034d5367fb68936575"
    	#autoupdate.strategy = "latest_forgejo_commit"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
     main.url = "/"

    [resources.nodejs]
    version = "24"
