#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cronmaster"
name = "Cronmaster"
description.en = "Cronjob management UI"
description.fr = ""

version = "2.3.2~ynh1"

maintainers = ["trendless"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/fccview/cronmaster"

# cpe = "???"

fund = ""

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "1G"
ram.runtime = "50M"

[install]

    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "admins"

[resources]

    [resources.sources]

    	[resources.sources.main]
    	url = "https://github.com/fccview/cronmaster/releases/download/2.3.2/cronmaster_2.3.2_prebuild.tar.gz"
    	sha256 = "8b75e4cc8b3fec7731fd847210d34046b9782aac27130cafdc260ebe6d63fb67"
    	autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.ports]
    main.default = 3000

    [resources.permissions]
     main.url = "/"

    [resources.nodejs]
    version = "20"
