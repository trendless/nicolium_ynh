#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "plfe"
name = "pl-fe"
description.en = "Social networking client app that works with any Mastodon API-compatible software"
description.fr = "Application cliente de réseau social compatible avec tout logiciel compatible avec l'API Mastodon"

version = "2025.11.22~ynh1"

maintainers = ["trendless"]

[upstream]
license = "AGPL-3.0-or-later"
demo = "https://pl.mkljczk.pl"
code = "https://codeberg.org/mkljczk/pl-fe"

# cpe = "???"

fund = "https://www.paypal.me/mkljczk"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "1G"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    	[resources.sources.main]
    	url = "https://codeberg.org/mkljczk/pl-fe/archive/a8cea70fec6109892a01d583b6f2d187254d60b9.tar.gz"
    	sha256 = "0b3e5a99f5250cfac7dffeb1c6aa6e040e6f658bb22b5ea880522078719ebebb"
    	#autoupdate.strategy = "latest_forgejo_commit"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
     main.url = "/"

    [resources.nodejs]
    version = "21"
