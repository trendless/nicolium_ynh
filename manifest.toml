#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nicolium"
name = "Nicolium"
description.en = "Mastodon-compatible social media front-end"
description.fr = "Mastodon-social compatible moyen front-end"

version = "2026.03.06~ynh1"

maintainers = ["trendless"]

[upstream]
license = "AGPL-3.0-or-later"
demo = "https://web.nicolium.app/"
code = "https://codeberg.org/mkljczk/nicolium"

# cpe = "???"

fund = "https://www.paypal.me/mkljczk"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "1G"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.backend_url]
    type = "string"
    ask.en = "Domain of the server you want to log in to with Nicolium?"
    help.en = "my.domain.tld"
    optional = true

[resources]

    [resources.sources]

    	[resources.sources.main]
    	url = "https://codeberg.org/nicolium/nicolium/archive/v1.0.0.tar.gz"
    	sha256 = "5250e20898b2bc02b4797205d4a05c2595fbeceef24d09d8d8a179b0c0acdfd8"
    	#autoupdate.strategy = "latest_forgejo_release"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
     main.url = "/"

    [resources.nodejs]
    version = "24"
