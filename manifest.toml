#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "plfe"
name = "pl-fe"
description.en = "Social networking client app that works with any Mastodon API-compatible software"
description.fr = "Application cliente de réseau social compatible avec tout logiciel compatible avec l'API Mastodon"

version = "2025.11.22~ynh1"

maintainers = ["trendless"]

[upstream]
license = "AGPL-3.0-or-later"
demo = "https://pl.mkljczk.pl"
code = "https://codeberg.org/mkljczk/pl-fe"
# FIXME: optional but recommended if relevant, this is meant to contain the Common Platform Enumeration, which is
# sort of a standard id for applications defined by the NIST. In particular, YunoHost may use this is in the future
# to easily track CVE (=security reports) related to apps. The CPE may be obtained by searching here:
# https://nvd.nist.gov/products/cpe/search.
# For example, for Nextcloud, the CPE is 'cpe:2.3:a:nextcloud:nextcloud' (no need to include the version number)
# cpe = "???"

# fund = "https://www.paypal.me/mkljczk"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "1G"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    	[resources.sources.main]
    	url = "https://codeberg.org/mkljczk/pl-fe/archive/498f1c9da018780d411f23902355176db87b16ed.tar.gz"
    	sha256 = "33d9211ac92c1a803e834fb7f3e2423b8f1cb262c9135e5d855ba48d288938e1"
    	#autoupdate.strategy = "latest_forgejo_commit"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
     main.url = "/"

    [resources.nodejs]
    version = "21"
